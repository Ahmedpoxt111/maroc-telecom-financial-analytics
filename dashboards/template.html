<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maroc Telecom — Finance 2023–2030</title>
<style>
:root{--navy:#222222;--blue:#222222;--orange:#666666;--paper:#FFFFFF;--line:#DDDDDD;--muted:#555555}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font:15px/1.55 Arial,sans-serif}header{background:white;color:var(--navy);padding:30px max(28px,calc((100vw - 1400px)/2));border-bottom:1px solid #BBBBBB}h1{margin:0;font-size:30px;font-weight:600}header p{color:#444444;margin:8px 0 0}main{max-width:1456px;margin:auto;padding:24px 28px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button,select{font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:0;background:white;color:var(--navy);cursor:pointer}nav button.active{background:var(--blue);color:white;border-color:var(--blue)}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}.scope{font-size:13px;color:var(--muted)}h2{font-size:23px;margin:0 0 12px}h3{font-size:17px;margin:0 0 10px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:20px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:0;padding:21px;box-shadow:0 2px 4px #22222204}.card small{color:var(--muted);display:block}.big{font-size:30px;font-weight:600;margin:8px 0}.change{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}.panel svg{width:100%;height:auto}table{border-collapse:collapse;width:100%;background:white;font-size:14px}th{background:#EEEEEE;text-align:right;padding:12px 14px;white-space:nowrap}th:first-child,td:first-child{text-align:left}td{text-align:right;padding:9px 14px;border-bottom:1px solid #DDDDDD;font-variant-numeric:tabular-nums}tr.total td,tr.subtotal td{font-weight:bold;background:#F7F7F7}tr.grand_total td{font-weight:bold;background:#E6E6E6;border-top:2px solid var(--blue)}.scroll{overflow:auto;max-height:650px;border:1px solid var(--line);border-radius:7px}thead{position:sticky;top:0;z-index:1}.note{background:#EEEEEE;padding:14px 18px;border-left:3px solid var(--blue);margin:16px 0}.warning{background:#F6F6F6;border-color:var(--orange)}a{color:#333333}.legend{display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span:before{content:' ';display:inline-block;width:14px;height:3px;background:var(--c);vertical-align:middle;margin-right:6px}.hidden{display:none}footer{color:var(--muted);font-size:12px;margin:30px 0}label{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ok{color:#333333}.bad{color:#333333}.tabletitle{margin:20px 0 10px}button:focus-visible,select:focus-visible{outline:3px solid #666666}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.big{font-size:25px}main{padding:18px}h1{font-size:25px}}@media print{nav,.toolbar,button{display:none}.scroll{max-height:none;overflow:visible}header{background:white;color:#222222}.cards,.grid{break-inside:avoid}body{background:white}}
</style></head><body><header><h1>Maroc Telecom · Analyse financière</h1><p>États sociaux IAM SA 2023–2025 · Groupe consolidé · Scénarios 2026–2030</p></header><main>
<nav id="nav"></nav><section id="content"></section><footer>Montants en millions de dirhams (MDH). Données sociales : DEU 2025, pages 233–237. Source vérifiée le 07/11/2026. Les projections sont des hypothèses pédagogiques sur base FY2025.</footer></main>
<script>
const D=/*DATA*/;let tab='États financiers',year=2025,statement='Bilan actif',scenario='central';
const names=['Synthèse','États financiers','Financement','Ratios financiers','Équilibre financier','Groupe consolidé','Prévisions & DCF','Contrôles & sources'];
const fmt=(v,p=1)=>v===null||v===''?'n.a.':Number(v).toLocaleString('fr-FR',{minimumFractionDigits:p,maximumFractionDigits:p});
const pct=v=>fmt(v*100,1)+' %';const colors=['#222222','#666666','#999999'];
function lineChart(title,x,series){const vals=series.flatMap(s=>s.v);let lo=Math.min(0,...vals),hi=Math.max(0,...vals)*1.15;if(hi===lo)hi=lo+1;const Y=v=>260-(v-lo)/(hi-lo)*210,X=i=>65+i*530/(x.length-1);let svg=`<svg viewBox="0 0 650 320" role="img" aria-label="${title}"><title>${title}</title>`;
for(let j=0;j<=4;j++){let v=lo+(hi-lo)*j/4,y=Y(v);svg+=`<line x1="65" x2="610" y1="${y}" y2="${y}" stroke="#DDDDDD"/><text x="55" y="${y+4}" text-anchor="end" font-size="11" fill="#555555">${fmt(v,0)}</text>`;}
x.forEach((v,i)=>svg+=`<text x="${X(i)}" y="283" text-anchor="middle" font-size="12" fill="#555555">${v}</text>`);
series.forEach((s,i)=>{svg+=`<polyline fill="none" stroke="${colors[i]}" stroke-width="3" points="${s.v.map((v,j)=>X(j)+','+Y(v)).join(' ')}"/>`;s.v.forEach((v,j)=>svg+=`<circle cx="${X(j)}" cy="${Y(v)}" r="4" fill="${colors[i]}"><title>${s.name} ${x[j]} : ${fmt(v)} MDH</title></circle>`)});return `<div class="panel"><h3>${title}</h3>${svg}</svg><div class="legend">${series.map((s,i)=>`<span style="--c:${colors[i]}">${s.name}</span>`).join('')}</div></div>`}
function bars(title,labels,values){let lo=Math.min(0,...values)*1.15,hi=Math.max(0,...values)*1.15;if(hi===lo)hi=lo+1;const y=v=>260-(v-lo)/(hi-lo)*210;return `<div class="panel"><h3>${title}</h3><svg viewBox="0 0 650 320" role="img" aria-label="${title}"><line x1="65" x2="620" y1="${y(0)}" y2="${y(0)}" stroke="#777777"/>${values.map((v,i)=>{let x=90+i*530/values.length;return `<rect x="${x}" y="${Math.min(y(0),y(v))}" width="${Math.min(75,350/values.length)}" height="${Math.abs(y(v)-y(0))}" fill="${v<0?'#666666':'#222222'}"><title>${labels[i]} : ${fmt(v)} MDH</title></rect><text x="${x+25}" y="${v<0?y(v)+17:y(v)-10}" font-size="12" text-anchor="middle" fill="#222222">${fmt(v,0)}</text><text x="${x+25}" y="300" text-anchor="middle" font-size="11" fill="#555555">${labels[i]}</text>`}).join('')}</svg></div>`}
const card=(label,value,note='')=>`<div class="card"><small>${label}</small><div class="big">${value}</div><div class="change">${note}</div></div>`;
const scope=()=>`<div class="scope">IAM SA seule · Comptes sociaux CGNC · MDH · Chiffres publiés</div>`;
function table(rows,cols){return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.type_ligne||''}">${cols.map(([k,l,t])=>`<td>${t==='text'?r[k]:t==='pct'?(r[k]===''?'n.a.':pct(r[k])):fmt(r[k],t==='check'?3:1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){document.getElementById('nav').innerHTML=names.map(n=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${n}</button>`).join('');let a=D.annual.find(x=>x.annee==year),s='';
if(tab==='Synthèse'){s=`<div class="top"><div><h2>Performance et capacité de financement</h2>${scope()}</div><div class="toolbar"><label>Année</label><select onchange="year=Number(this.value);render()">${[2023,2024,2025].map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></div></div><div class="cards">${card('Chiffre d’affaires',fmt(a.ca),'MDH · '+year)}${card('EBE / chiffre d’affaires',pct(a.marge_ebe),'EBE : '+fmt(a.ebe)+' MDH')}${card('Résultat net',fmt(a.resultat_net),'MDH · Comptes sociaux')}${card('Capacité d’autofinancement',fmt(a.caf),'MDH · ESG publié')}</div><div class="grid">${lineChart('CA et valeur ajoutée — IAM SA',D.annual.map(x=>x.annee),[{name:'Chiffre d’affaires',v:D.annual.map(x=>x.ca)},{name:'Valeur ajoutée',v:D.annual.map(x=>x.valeur_ajoutee)}])}${bars('Résultat net social et effet des non-récurrents',['2023','2024','2025'],D.annual.map(x=>x.resultat_net))}</div><div class="note">Le résultat net social 2025 remonte fortement, tandis que l’EBE recule. Le résultat non courant passe de ${fmt(D.annual[1].resultat_non_courant)} MDH en 2024 à ${fmt(D.annual[2].resultat_non_courant)} MDH en 2025. La reprise du résultat net ne doit pas être assimilée à la seule performance opérationnelle récurrente.</div><div class="grid">${lineChart('EBE et CAF — IAM SA',D.annual.map(x=>x.annee),[{name:'EBE',v:D.annual.map(x=>x.ebe)},{name:'CAF',v:D.annual.map(x=>x.caf)}])}${bars('Structure du bilan net — '+year,['Immobilisé','Circulant','Trésorerie'],[a.actif_immobilise,a.actif_circulant,a.tresorerie_actif])}</div>`}
if(tab==='États financiers'){const r=D.tables[statement];s=`<div class="top"><div><h2>Tableaux financiers 2023–2025</h2>${scope()}</div><div class="toolbar"><select onchange="statement=this.value;render()">${Object.keys(D.tables).map(n=>`<option ${n===statement?'selected':''}>${n}</option>`).join('')}</select><button onclick="download()">Télécharger ce tableau CSV</button></div></div><div class="note">${statement==='Bilan actif'?'Actif présenté en valeurs nettes. ':''}Valeurs publiées conservées après conversion milliers MAD → MDH. Les variations sont calculées; « n.a. » signifie base 2024 nulle. Les sous-totaux ne doivent pas être additionnés aux détails.</div>${table(r,[['libelle',statement,'text'],['2023','2023'],['2024','2024'],['2025','2025'],['variation_25_24','Δ 2025/24'],['variation_pct_25_24','Δ %','pct'],['page','Page DEU']])}`}
if(tab==='Équilibre financier'){s=`<h2>Fonds de roulement et trésorerie</h2>${scope()}<div class="note">Calculs sur bilan social net : FR = financement permanent − actif immobilisé; BFG = actif circulant − passif circulant, hors trésorerie; trésorerie nette = FR − BFG, sous réserve d’arrondis.</div><div class="grid">${lineChart('Équilibre financier — MDH',[2023,2024,2025],[{name:'FR fonctionnel',v:D.annual.map(x=>x.fr)},{name:'BFG',v:D.annual.map(x=>x.bfg)},{name:'Trésorerie nette',v:D.annual.map(x=>x.tresorerie_nette)}])}${bars('Trésorerie nette — MDH',[2023,2024,2025],D.annual.map(x=>x.tresorerie_nette))}</div>${table(D.annual,[['annee','Année','text'],['fr','FR fonctionnel'],['bfg','BFG'],['tresorerie_nette','Trésorerie nette'],['autonomie','CP / actif','pct'],['marge_nette','RN / CA','pct']])}`}
if(tab==='Groupe consolidé'){let g=[2023,2024,2025].map(y=>({annee:y,...D.group[y]}));s=`<h2>Groupe Maroc Telecom — périmètre consolidé</h2><div class="note warning">Ce périmètre inclut les filiales. Il est distinct d’IAM SA seule. Le CA IFRS 2024 est de 36 699 MDH dans S2, contre 36 704 MDH dans la série KPI S1. Les marges ajustées utilisent le CA KPI; les ratios IFRS utilisent le CA IFRS.</div><div class="grid">${lineChart('Indicateurs ajustés du Groupe — MDH',[2023,2024,2025],[{name:'CA KPI',v:g.map(x=>x.revenue_kpi)},{name:'EBITDA ajusté',v:g.map(x=>x.ebitda_adjusted)},{name:'EBITA ajusté',v:g.map(x=>x.ebita_adjusted)}])}${bars('Résultat net IFRS, part Groupe — MDH',[2023,2024,2025],g.map(x=>x.net_income_group))}</div>${table(g,[['annee','Année','text'],['revenue_ifrs','CA IFRS'],['revenue_kpi','CA KPI'],['ebitda_adjusted','EBITDA ajusté'],['net_income_group','RN part Groupe'],['assets','Total actif']])}`}
if(tab==='Prévisions & DCF'){let f=D.forecasts.filter(x=>x.scenario===scenario),v=D.dcf.find(x=>x.scenario===scenario);s=`<div class="top"><div><h2>Scénarios du Groupe 2026–2030</h2><div class="scope">Hypothèses auteur · Base FY2025 · Valorisation au 31/12/2025</div></div><select onchange="scenario=this.value;render()">${['prudent','central','favorable'].map(n=>`<option ${n===scenario?'selected':''}>${n}</option>`).join('')}</select></div><div class="cards">${card('Valeur d’entreprise indicative',fmt(v.enterprise_value,0),'MDH · calcul sur hypothèses')}${card('WACC',pct(v.wacc),'Hypothèse')}${card('Croissance perpétuelle',pct(v.terminal_growth),'Hypothèse')}${card('Part de valeur terminale',pct(v.terminal_share),'Sensibilité élevée aux hypothèses')}</div><div class="grid">${lineChart('CA prévisionnel — trois scénarios',[2026,2027,2028,2029,2030],['prudent','central','favorable'].map(n=>({name:n,v:D.forecasts.filter(x=>x.scenario===n).map(x=>+x.revenue)})))}${bars('FCFF prévisionnel — '+scenario,[2026,2027,2028,2029,2030],f.map(x=>+x.fcff))}</div>${table(f,[['year','Année','text'],['revenue','CA'],['ebitda','EBITDA'],['capex_total','CAPEX total'],['delta_nwc','Variation BFR'],['fcff','FCFF']])}<div class="note warning">Ces montants sont des projections pédagogiques, pas des résultats publiés ni les objectifs de la direction. Les publications 2026 ne sont pas intégrées. La VE consolidée n’est pas une valeur des actions de la société mère. Hypothèses complètes dans config/scenarios.csv et docs/methodology.md.</div>`}
if(tab==='Contrôles & sources'){s=`<h2>Traçabilité et rapprochements</h2><p>${D.checks.length} contrôles sur les états sociaux. Tolérance d’arrondis : 0,005 MDH. ${D.checks.filter(x=>x.resultat!=='OK').length} écart hors tolérance.</p>${table(D.checks,[['annee','Année','text'],['controle','Contrôle','text'],['ecart_mdh','Écart MDH','check'],['resultat','Résultat','text']])}<h3 class="tabletitle">Sources</h3><div class="panel">${D.sources.map(x=>`<p><b>${x.source_id}</b> · <a href="${x.url}" target="_blank" rel="noopener">${x.title}</a><br><small>${x.locator} · Consultation ${x.accessed}</small></p>`).join('')}</div><div class="note">Écart publié d’arrondi : marge brute sociale 2023 de −12,632 MDH, contre −12,631 MDH calculés sur les deux postes arrondis. Le chiffre publié est conservé.</div>`}
if(tab==='Ratios financiers'){s=`<h2>19 ratios financiers — IAM SA</h2>${scope()}<div class="note">Calculs sur les comptes sociaux : noms en français, formules et interprétations. Les taux sont en pourcentage, les autres rapports en fois.</div><div class="scroll"><table><thead><tr><th>Ratio</th><th>Formule</th><th>2023</th><th>2024</th><th>2025</th><th>Lecture</th></tr></thead><tbody>${D.ratios_fr.map(r=>`<tr><td>${r.ratio}</td><td>${r.formule}</td>${[2023,2024,2025].map(y=>`<td>${r[y]===''?'n.d.':r.unite==='%'?pct(r[y]):fmt(r[y],2)+' x'}</td>`).join('')}<td>${r.interpretation}</td></tr>`).join('')}</tbody></table></div>`}
if(tab==='Financement'){s=`<h2>Tableau de financement — emplois et ressources</h2>${scope()}<p>Chiffres publiés : DEU 2025, page 238. MDH. Les sous-totaux ne s’additionnent pas avec leurs détails.</p>${table(D.financement,[['libelle','Poste','text'],['emplois_2023','2023 Emplois'],['ressources_2023','2023 Ressources'],['emplois_2024','2024 Emplois'],['ressources_2024','2024 Ressources'],['emplois_2025','2025 Emplois'],['ressources_2025','2025 Ressources']])}`}
document.getElementById('content').innerHTML=s;}
function download(){let r=D.tables[statement],keys=Object.keys(r[0]),csv='\ufeff'+[keys,...r.map(x=>keys.map(k=>x[k]))].map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=statement+'.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
